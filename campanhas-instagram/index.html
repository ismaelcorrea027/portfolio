<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campanhas para Instagram — Ismael Corrêa</title>
  <meta name="description" content="Galeria de campanhas para Instagram criada por Ismael Corrêa.">
  <meta name="theme-color" content="#080b0f">
  <style>
    :root{--bg:#080b0f;--surface:#10151d;--line:#273140;--ink:#f4f5f7;--muted:#a1acba;--lime:#9bea16;--cyan:#20b8c8}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif;line-height:1.5;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:52px 52px}
    img,video{display:block;width:100%}
    a{color:inherit}
    .wrap{width:min(1120px,calc(100% - 40px));margin:auto}
    .topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{font-weight:800;letter-spacing:.08em;text-decoration:none}.brand span{color:var(--lime)}
    .back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-size:14px}.back:hover{color:var(--ink)}
    header{padding:64px 0 48px;position:relative;overflow:hidden}
    header::after{content:"";position:absolute;width:430px;height:430px;border-radius:50%;right:-170px;top:-220px;background:radial-gradient(circle,rgba(155,234,22,.18),transparent 68%);pointer-events:none}
    .eyebrow{margin:0 0 12px;color:var(--lime);font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    h1{font-size:clamp(42px,7vw,76px);line-height:1;margin:0;letter-spacing:-.045em;max-width:820px}
    .intro{color:var(--muted);font-size:18px;max-width:620px;margin:22px 0 0}
    .section{padding:36px 0 72px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:22px}
    h2{font-size:clamp(28px,4vw,42px);margin:0;letter-spacing:-.025em}.count{color:var(--muted);font-size:14px}
    .video-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    .media-card{margin:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#121923,#0b0f15);box-shadow:0 28px 55px -38px #000}
    .video-frame{background:#000;aspect-ratio:9/16;max-height:690px;display:flex;justify-content:center}
    .video-frame video{height:100%;width:auto;max-width:100%;object-fit:contain}
    figcaption{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;font-weight:700}
    .tag{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
    .gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
    .gallery .media-card{transition:transform .25s,border-color .25s}.gallery .media-card:hover{transform:translateY(-4px);border-color:rgba(155,234,22,.55)}
    .gallery img{aspect-ratio:9/16;object-fit:cover;background:#050607}
    footer{padding:28px 0 42px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
    @media(max-width:820px){.gallery{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:640px){.wrap{width:min(100% - 28px,1120px)}header{padding:44px 0 28px}.intro{font-size:16px}.video-grid{grid-template-columns:1fr}.section{padding:28px 0 52px}.section-head{align-items:flex-start;flex-direction:column;gap:4px}.gallery{gap:10px}.media-card{border-radius:12px}figcaption{padding:12px;font-size:13px}.tag{display:none}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.gallery .media-card{transition:none}}
  </style>
</head>
<body>
  <nav class="topbar wrap" aria-label="Navegação">
    <a class="brand" href="../index.html">IC<span>.</span></a>
    <a class="back" href="../index.html#projetos" aria-label="Voltar para os projetos">← Voltar ao portfólio</a>
  </nav>

  <header>
    <div class="wrap">
      <p class="eyebrow">Conteúdo digital · Social media</p>
      <h1>Campanhas para Instagram</h1>
      <p class="intro">Vídeos e peças verticais de divulgação desenvolvidos para campanhas de creatina.</p>
    </div>
  </header>

  <main>
    <section class="section" aria-labelledby="videos-title">
      <div class="wrap">
        <div class="section-head"><h2 id="videos-title">Vídeos da campanha</h2><span class="count">2 peças</span></div>
        <div class="video-grid">
          <figure class="media-card">
            <div class="video-frame"><video controls playsinline preload="metadata" poster="assets/creatina-growth-1.png"><source src="assets/creatina-growth.mp4" type="video/mp4">Seu navegador não suporta vídeos HTML5.</video></div>
            <figcaption><span>Creatina Growth</span><span class="tag">Reels / Story</span></figcaption>
          </figure>
          <figure class="media-card">
            <div class="video-frame"><video controls playsinline preload="metadata" poster="assets/story-creatina-soldiers.png"><source src="assets/creatina-soldiers.mp4" type="video/mp4">Seu navegador não suporta vídeos HTML5.</video></div>
            <figcaption><span>Creatina Soldiers</span><span class="tag">Reels / Story</span></figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="section" aria-labelledby="artes-title">
      <div class="wrap">
        <div class="section-head"><h2 id="artes-title">Artes de divulgação</h2><span class="count">4 peças verticais</span></div>
        <div class="gallery">
          <figure class="media-card"><img src="assets/creatina-growth-1.png" alt="Arte 1 da campanha de creatina Growth" loading="lazy"><figcaption><span>Growth 01</span><span class="tag">Story</span></figcaption></figure>
          <figure class="media-card"><img src="assets/creatina-growth-2.png" alt="Arte 2 da campanha de creatina Growth" loading="lazy"><figcaption><span>Growth 02</span><span class="tag">Story</span></figcaption></figure>
          <figure class="media-card"><img src="assets/creatina-growth-3.png" alt="Arte 3 da campanha de creatina Growth" loading="lazy"><figcaption><span>Growth 03</span><span class="tag">Story</span></figcaption></figure>
          <figure class="media-card"><img src="assets/story-creatina-soldiers.png" alt="Arte de oferta da creatina Soldiers" loading="lazy"><figcaption><span>Soldiers</span><span class="tag">Story</span></figcaption></figure>
        </div>
      </div>
    </section>
  </main>

  <footer><div class="wrap">© 2026 Ismael de Oliveira Corrêa — Web Designer Sênior</div></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendamento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chenfengyuan/datepicker/dist/datepicker.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="css/grid_full.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="flex column  center">

	<div class="logo"><img class="w-200" src="img/unimed-grey.png"></div>
	
	<div class="container flex column mt-0 w-100-p">
            
			<h3 class="fw-bold mb-3">Cadastro de fornecedor</h3>

            <div class="mb-3">
              <label for="modalEmpresaFornecedor" class="form-label">Empresa</label>
              <input type="text" class="form-control" id="modalEmpresaFornecedor">
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="modalCNPJFornecedor" class="form-label">CNPJ</label>
                <input type="text" class="form-control" id="modalCNPJFornecedor" placeholder="00.000.000/0000-00">
              </div>
              <div class="col-md-6 mb-3">
                <label for="modalTelefoneFornecedor" class="form-label">Telefone</label>
                <input type="tel" class="form-control" id="modalTelefoneFornecedor" placeholder="(00) 0000-0000">
              </div>
            </div>

            <div class="mb-3">
              <label for="modalEnderecoFornecedor" class="form-label">Endereço</label>
              <input type="text" class="form-control" id="modalEnderecoFornecedor" placeholder="Rua, Avenida, etc.">
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="modalCidadeFornecedor" class="form-label">Cidade</label>
                <input type="text" class="form-control" id="modalCidadeFornecedor">
              </div>
              <div class="col-md-4 mb-3">
                <label for="modalEstadoFornecedor" class="form-label">Estado</label>
                <input type="text" class="form-control" id="modalEstadoFornecedor" maxlength="2" placeholder="UF">
              </div>
              <div class="col-md-2 mb-3">
                <label for="modalCepFornecedor" class="form-label">CEP</label>
                <input type="text" class="form-control" id="modalCepFornecedor" placeholder="00000-000">
              </div>
            </div>
			
			<button type="button" class="btn btn-primary w-100-p btnAvancar mt-20">Cadastrar fornecedor</button>

          </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@chenfengyuan/datepicker/dist/datepicker.min.js"></script>
<script src="js/custom.js"></script>

</body>
</html>
